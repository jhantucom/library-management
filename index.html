<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Library Management System</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#1f2937}
header{background:#173b8f;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:25px}header p{margin:6px 0 0}
.container{max-width:1100px;margin:auto;padding:15px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}
.card,.box{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}
.card h3{margin:0;color:#64748b;font-size:15px}.num{font-size:28px;font-weight:bold;color:#173b8f;margin-top:8px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{border:0;border-radius:9px;padding:12px 14px;background:#173b8f;color:white;font-size:15px;cursor:pointer}
button.green{background:#15803d}button.red{background:#dc2626}button.gray{background:#64748b}button.orange{background:#ea580c}
.section{display:none}.section.active{display:block}
.box{margin-bottom:15px}h2{color:#173b8f;margin-top:0}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 0 10px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{padding:9px 12px;font-size:13px}
.item{border:1px solid #dbe2ea;border-radius:10px;padding:13px;margin-top:10px}
.item h3{margin:0 0 7px;color:#173b8f}.muted{color:#64748b;font-size:14px}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.seat{padding:13px 5px;text-align:center;border-radius:8px;background:#dcfce7;color:#166534;font-weight:bold;cursor:pointer}
.seat.occupied{background:#fee2e2;color:#991b1b}.seat small{display:block;font-weight:normal;font-size:10px}
.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px}th{background:#eef2ff}
#login{position:fixed;inset:0;background:#173b8f;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.loginbox{background:white;width:min(400px,100%);padding:25px;border-radius:16px}.loginbox h2{text-align:center}
.small{font-size:12px;color:#64748b}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.seats{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>

<div id="login">
<div class="loginbox">
<h2>🔐 Admin Login</h2>
<input id="loginUser" placeholder="Username" value="admin">
<input id="loginPass" type="password" placeholder="Password">
<button style="width:100%" onclick="login()">Login</button>
<p class="small" style="margin-top:10px">Default: admin / admin123</p>
<p id="loginMsg" style="color:#dc2626"></p>
</div>
</div>

<header><h1>📚 Library Management</h1><p id="libTitle">Library Admin Dashboard</p></header>

<div class="container">
<div id="dashboard" class="section active">
<div class="cards">
<div class="card"><h3>👥 Total Members</h3><div class="num" id="totalMembers">0</div></div>
<div class="card"><h3>💺 Available Seats</h3><div class="num" id="availableSeats">100</div></div>
<div class="card"><h3>💰 Pending Fees</h3><div class="num" id="pendingFees">₹0</div></div>
<div class="card"><h3>💵 Total Collection</h3><div class="num" id="collection">₹0</div></div>
</div>
<div class="menu">
<button onclick="openSec('members')">👥 Members</button>
<button onclick="openSec('seats')">💺 Seats</button>
<button onclick="openSec('fees')">💰 Fees</button>
<button onclick="openSec('notices')">📢 Notices</button>
<button onclick="openSec('reports')">📊 Reports</button>
<button onclick="openSec('settings')">⚙️ Settings</button>
<button class="gray" onclick="logout()">🚪 Logout</button>
</div>
</div>

<div id="members" class="section">
<div class="topbar"><h2>👥 Members</h2><button class="gray" onclick="openSec('dashboard')">← Dashboard</button></div>
<div class="box">
<button onclick="memberForm()">➕ Add Member</button>
<input id="memberSearch" placeholder="🔍 Search name/mobile/seat" oninput="renderMembers()">
<div id="memberFormBox"></div><div id="membersList"></div>
</div>
</div>

<div id="seats" class="section">
<div class="topbar"><h2>💺 100 Seats</h2><button class="gray" onclick="openSec('dashboard')">← Dashboard</button></div>
<div class="box"><p>🟢 Vacant &nbsp; 🔴 Occupied</p><div id="seatGrid" class="seats"></div></div>
</div>

<div id="fees" class="section">
<div class="topbar"><h2>💰 Fees</h2><button class="gray" onclick="openSec('dashboard')">← Dashboard</button></div>
<div class="box">
<div class="grid2"><select id="feeMember"></select><input id="feeAmount" type="number" placeholder="Payment amount"></div>
<input id="feeDate" type="date"><button class="green" onclick="addPayment()">💵 Record Payment</button>
<div id="feeList"></div>
</div>
</div>

<div id="notices" class="section">
<div class="topbar"><h2>📢 Notices</h2><button class="gray" onclick="openSec('dashboard')">← Dashboard</button></div>
<div class="box">
<input id="noticeText" placeholder="Notice लिखें">
<button onclick="addNotice()">➕ Add Notice</button><div id="noticeList"></div>
</div>
</div>

<div id="reports" class="section">
<div class="topbar"><h2>📊 Reports</h2><button class="gray" onclick="openSec('dashboard')">← Dashboard</button></div>
<div class="box" id="reportBox"></div>
</div>

<div id="settings" class="section">
<div class="topbar"><h2>⚙️ Settings</h2><button class="gray" onclick="openSec('dashboard')">← Dashboard</button></div>
<div class="box">
<label>Library Name</label><input id="libraryName">
<button onclick="saveSettings()">💾 Save Settings</button>
<hr style="border:0;border-top:1px solid #ddd;margin:18px 0">
<button class="red" onclick="clearAllData()">⚠️ Delete All App Data</button>
</div>
</div>
</div>


<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBzyroJhZVEGAgqxNckWB36yQkA3HXUIls",
  authDomain: "library-management-93ad4.firebaseapp.com",
  projectId: "library-management-93ad4",
  storageBucket: "library-management-93ad4.firebasestorage.app",
  messagingSenderId: "562837358063",
  appId: "1:562837358063:web:b62b1be56dccb351dc621a"
};

let db = null;
let cloudDoc = null;
let cloudReady = false;

try {
  if (typeof firebase !== "undefined") {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    cloudDoc = db.collection("library").doc("main");
  } else {
    console.warn("Firebase SDK not loaded; local mode enabled.");
  }
} catch (e) {
  console.error("Firebase init error:", e);
  db = null;
  cloudDoc = null;
}

const KEY="libraryFullAppV1";
let data;
try {
  data = JSON.parse(localStorage.getItem(KEY) || "null");
} catch(e) {
  console.warn("Local data reset:", e);
  data = null;
}
if (!data || typeof data !== "object") {
  data={members:[],payments:[],notices:[],settings:{name:"Library Admin Dashboard"}};
}
data.members = Array.isArray(data.members) ? data.members : [];
data.payments = Array.isArray(data.payments) ? data.payments : [];
data.notices = Array.isArray(data.notices) ? data.notices : [];
data.settings = data.settings && typeof data.settings === "object"
  ? data.settings : {name:"Library Admin Dashboard"};

function localSave(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

async function loadCloud(){
  if(!cloudDoc){
    cloudReady=false;
    updateAll();
    return;
  }
  try{
    const snap = await cloudDoc.get();
    if(snap.exists){
      const cloudData = snap.data() || {};
      data = {
        members:Array.isArray(cloudData.members)?cloudData.members:[],
        payments:Array.isArray(cloudData.payments)?cloudData.payments:[],
        notices:Array.isArray(cloudData.notices)?cloudData.notices:[],
        settings:cloudData.settings || {name:"Library Admin Dashboard"}
      };
      localSave();
    }else{
      await cloudDoc.set(data);
    }
    cloudReady = true;
    updateAll();
  }catch(e){
    console.error("Firestore load error:", e);
    cloudReady=false;
    updateAll();
  }
}

async function persist(){
  localSave();
  updateAll();
  if(!cloudReady)return;
  if(!cloudDoc)return;
  try{
    await cloudDoc.set(data);
  }catch(e){
    console.error(e);
    alert("Cloud save failed. Internet/Firestore settings check करें।");
  }
}

function login(){
  const u=document.getElementById("loginUser").value.trim();
  const p=document.getElementById("loginPass").value;
  const msg=document.getElementById("loginMsg");
  if(u==="admin" && p==="admin123"){
    document.getElementById("login").style.display="none";
    sessionStorage.setItem("libLogin","1");
    msg.innerText="";
    updateAll();
  }else{
    msg.innerText="Username या Password गलत है";
  }
}
document.getElementById("loginPass").addEventListener("keydown",function(e){
  if(e.key==="Enter") login();
});
document.getElementById("loginUser").addEventListener("keydown",function(e){
  if(e.key==="Enter") login();
});
function logout(){sessionStorage.removeItem("libLogin");location.reload()}
if(sessionStorage.getItem("libLogin")==="1")document.getElementById("login").style.display="none";

function openSec(id){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
updateAll();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function memberForm(index=-1){
let m=index>=0?data.members[index]:{};
document.getElementById("memberFormBox").innerHTML=`<div class="box">
<h3>${index>=0?"✏️ Edit":"➕ Add"} Member</h3>
<div class="grid2">
<input id="mName" placeholder="Name" value="${esc(m.name)}">
<input id="mMobile" placeholder="Mobile" value="${esc(m.mobile)}">
<input id="mSeat" type="number" min="1" max="100" placeholder="Seat 1-100" value="${m.seat||""}">
<input id="mFee" type="number" placeholder="Monthly Fee" value="${m.fee||""}">
<input id="mJoin" type="date" value="${m.join||""}">
<input id="mExpiry" type="date" value="${m.expiry||""}">
</div>
<select id="mStatus"><option ${m.status==="Paid"?"selected":""}>Paid</option><option ${m.status==="Pending"||!m.status?"selected":""}>Pending</option></select>
<button class="green" onclick="saveMember(${index})">💾 Save</button>
<button class="gray" onclick="document.getElementById('memberFormBox').innerHTML=''">Cancel</button>
</div>`;
}
function saveMember(index){
let m={name:document.getElementById("mName").value.trim(),mobile:document.getElementById("mMobile").value.trim(),seat:document.getElementById("mSeat").value,fee:Number(document.getElementById("mFee").value||0),join:document.getElementById("mJoin").value,expiry:document.getElementById("mExpiry").value,status:document.getElementById("mStatus").value};
if(!m.name){alert("Name जरूरी है");return}
if(m.seat&&(m.seat<1||m.seat>100)){alert("Seat 1-100");return}
if(data.members.some((x,i)=>i!==index&&x.seat&&String(x.seat)===String(m.seat))){alert("यह seat occupied है");return}
if(index<0)data.members.push(m);else data.members[index]=m;
persist();document.getElementById("memberFormBox").innerHTML="";alert("Member saved");
}
function deleteMember(i){if(confirm("Delete member?")){data.members.splice(i,1);persist()}}
function renderMembers(){
let q=(document.getElementById("memberSearch")?.value||"").toLowerCase();
let a=data.members.filter(m=>`${m.name} ${m.mobile} ${m.seat}`.toLowerCase().includes(q));
document.getElementById("membersList").innerHTML=a.length?a.map(m=>{let i=data.members.indexOf(m);return `<div class="item"><h3>${esc(m.name)}</h3><div class="muted">📱 ${esc(m.mobile)} &nbsp; 💺 Seat ${esc(m.seat||"-")} &nbsp; 💰 ₹${m.fee}</div><p>Joining: ${esc(m.join||"-")} | Expiry: ${esc(m.expiry||"-")}</p><p>Status: <b>${esc(m.status)}</b></p><div class="actions"><button class="edit" onclick="memberForm(${i})">✏️ Edit</button><button class="red" onclick="deleteMember(${i})">🗑️ Delete</button></div></div>`}).join(""):"<p class='muted'>कोई member नहीं मिला।</p>";
}
function renderSeats(){
let map={};data.members.forEach(m=>{if(m.seat)map[m.seat]=m.name});
document.getElementById("seatGrid").innerHTML=Array.from({length:100},(_,i)=>{let n=i+1;return `<div class="seat ${map[n]?"occupied":""}" onclick="${map[n]?"alert('Seat "+n+" : "+esc(map[n]).replace(/'/g,"\\'")+"')":"memberForm()"}">${n}<small>${map[n]?esc(map[n]):"Vacant"}</small></div>`}).join("");
}
function renderFees(){
let s=document.getElementById("feeMember");s.innerHTML=data.members.map((m,i)=>`<option value="${i}">${esc(m.name)} - Seat ${esc(m.seat||"-")}</option>`).join("");
document.getElementById("feeDate").value=document.getElementById("feeDate").value||new Date().toISOString().slice(0,10);
document.getElementById("feeList").innerHTML=data.payments.slice().reverse().map(p=>`<div class="item">💵 <b>${esc(p.name)}</b> — ₹${p.amount} — ${p.date}</div>`).join("")||"<p class='muted'>No payments yet.</p>";
}
function addPayment(){
if(!data.members.length){alert("पहले member add करें");return}
let i=Number(document.getElementById("feeMember").value),amount=Number(document.getElementById("feeAmount").value);
if(!amount){alert("Amount डालें");return}
data.payments.push({name:data.members[i].name,amount,date:document.getElementById("feeDate").value});
data.members[i].status="Paid";persist();document.getElementById("feeAmount").value="";alert("Payment saved");
}
function addNotice(){
let t=document.getElementById("noticeText").value.trim();if(!t)return;
data.notices.push({text:t,date:new Date().toLocaleDateString("en-IN")});persist();document.getElementById("noticeText").value="";
}
function renderNotices(){
document.getElementById("noticeList").innerHTML=data.notices.slice().reverse().map((n,i)=>`<div class="notice">📢 ${esc(n.text)} <span class="muted">(${n.date})</span> <button class="red" style="float:right;padding:6px" onclick="deleteNotice(${data.notices.length-1-i})">Delete</button></div>`).join("")||"<p class='muted'>No notices.</p>";
}
function deleteNotice(i){data.notices.splice(i,1);persist()}
function renderReports(){
let occupied=new Set(data.members.filter(m=>m.seat).map(m=>String(m.seat))).size;
let pending=data.members.filter(m=>m.status==="Pending").reduce((a,m)=>a+Number(m.fee||0),0);
let collection=data.payments.reduce((a,p)=>a+Number(p.amount||0),0);
document.getElementById("reportBox").innerHTML=`<div class="grid3"><div class="card"><h3>Members</h3><div class="num">${data.members.length}</div></div><div class="card"><h3>Occupied Seats</h3><div class="num">${occupied}</div></div><div class="card"><h3>Pending</h3><div class="num">₹${pending}</div></div></div><table><tr><th>Name</th><th>Seat</th><th>Fee</th><th>Status</th></tr>${data.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.seat||"-")}</td><td>₹${m.fee}</td><td>${esc(m.status)}</td></tr>`).join("")}</table><p style="margin-top:12px"><b>Total payment collection: ₹${collection}</b></p>`;
}
function saveSettings(){let n=document.getElementById("libraryName").value.trim();if(n){data.settings.name=n;persist();alert("Settings saved")}}
async function clearAllData(){
  if(confirm("सारा app data delete होगा. Continue?")){
    localStorage.removeItem(KEY);
    if(cloudDoc){try{await cloudDoc.delete()}catch(e){console.error(e)}}
    location.reload();
  }
}
function updateAll(){
document.getElementById("libTitle").innerText=data.settings.name||"Library Admin Dashboard";
document.getElementById("totalMembers").innerText=data.members.length;
let occ=new Set(data.members.filter(m=>m.seat).map(m=>String(m.seat))).size;
document.getElementById("availableSeats").innerText=100-occ;
let pending=data.members.filter(m=>m.status==="Pending").reduce((a,m)=>a+Number(m.fee||0),0);
document.getElementById("pendingFees").innerText="₹"+pending;
document.getElementById("collection").innerText="₹"+data.payments.reduce((a,p)=>a+Number(p.amount||0),0);
renderMembers();renderSeats();renderFees();renderNotices();renderReports();
document.getElementById("libraryName").value=data.settings.name||"";
}
updateAll();
loadCloud();
</script>
</body>
</html>
